<!DOCTYPE html>
<html lang="hu">
<head>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="profil.css">
    <title>SZE Tanulmányi Fórum - Profil</title>
    <script defer src="profil.js"></script> <!-- JS betöltése -->
</head>
<body>
    <header>
        <div class="hamburger-menu">
            <input id="menu-toggle" type="checkbox" />
            <label class="menu-btn" for="menu-toggle">
                <span></span>
            </label>
            <ul class="menu-box">
                <li><a class="menu-item" href="fooldal.html">Főoldal</a></li>
                <li id="loginItem"><a class="menu-item" href="login.html">Bejelentkezés</a></li>
                <li id="logoutItem" style="display:none;"><a class="menu-item" href="#" onclick="logout()">Kijelentkezés</a></li>
                <li id="profileItem" style="display:none;"><a class="menu-item" href="#">Profilom</a></li>
                <li id="messagesItem" style="display:none;"><a class="menu-item" href="#">Üzenetek</a></li>
                <li id="topicsItem" style="display:none;"><a class="menu-item" href="#">Témáim</a></li>
                <li id="adminPanel" style="display:none;"><a class="menu-item" href="#">Adminisztrátori Panel</a></li>
            </ul>
        </div>
        <h1 class="header-title">SZE Tanulmányi Fórum</h1>
    </header>

    <main>
        <div class="profile">
            <h2>Profilom</h2>
            <div class="profile-info">
                <img src="profiletest.png" alt="Profilkép" class="profile-pic">
                <div class="info-details">
                    <h3 id="username"><strong>Felhasználónév</strong></h3>
                    <div class="stat-section">
                        <p><strong>Témák száma:</strong> <span id="topic-count">0</span></p>
                        <p><strong>Hozzászólások száma:</strong> <span id="comment-count">0</span></p>
                        <p><strong>Reputáció:</strong></p>
                        <div class="likes-dislikes">
                            <div class="likes">
                                <img src="up.png" alt="Like" class="like-icon">
                                <span id="like-count">0</span>
                            </div>
                            <div class="dislikes">
                                <img src="down.png" alt="Dislike" class="dislike-icon">
                                <span id="dislike-count">0</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="user-topics">
                <h3>Témáim</h3>
                <ul id="topic-list">
                    <!-- Témák dinamikusan betöltve -->
                </ul>
            </div>
            <a href="#" class="message-button" onclick="window.location.href='uzenet.html';">Üzenet írása</a>
            <a href="#" class="edit-button" onclick="window.location.href='profile_edit.html';">Profilom szerkesztése</a>
        </div>
    </main>

    <footer>
        <div class="contact-section">
            <h2>Kapcsolat</h2>
            <p>Email: asdasd@sze.hu</p>
        </div>
    </footer>

    <script>
        function searchTopics() {
                    const query = document.getElementById('searchInput').value.trim();
        
                    if (!query) {
                        document.getElementById('searchResults').innerHTML = '<p>Kérlek, adj meg egy keresési kifejezést.</p>';
                        return;
                    }
        
                    fetch(`http://localhost:5001/api/topics/search?query=${encodeURIComponent(query)}`)
                        .then(response => {
                            if (!response.ok) {
                                throw new Error('Hiba történt a keresés során.');
                            }
                            return response.json();
                        })
                        .then(data => {
                            const searchResults = document.getElementById('searchResults');
                            searchResults.innerHTML = '';
        
                            if (data.length === 0) {
                                searchResults.innerHTML = '<p>Nincs találat a keresett kifejezésre.</p>';
                                return;
                            }
        
                            // Találatok megjelenítése
                            data.forEach(item => {
                                const resultDiv = document.createElement('div');
                                resultDiv.innerHTML = `
                                    <a href="tema_elonezet.html?id=${item.id}" class="search-item">${item.title}</a>
                                `;
                                searchResults.appendChild(resultDiv);
                            });
                        })
                        .catch(error => {
                            console.error(error);
                            document.getElementById('searchResults').innerHTML = '<p>Hiba történt a keresés során.</p>';
                        });
                }
                document.addEventListener("DOMContentLoaded", function() {
                    const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
                    const role = localStorage.getItem('role') || '';
                    const userId = localStorage.getItem('userId'); 
        
                    // Menü frissítése a bejelentkezési állapot alapján
                    if (isLoggedIn) {
                        // Bejelentkezett felhasználó
                        document.getElementById('loginItem').style.display = 'none';
                        document.getElementById('logoutItem').style.display = 'block';
                        document.getElementById('profileItem').style.display = 'block';
                        document.getElementById('messagesItem').style.display = 'block';
                        document.getElementById('topicsItem').style.display = 'block';
        
                        if (role === 'admin') {
                            document.getElementById('adminPanel').style.display = 'block'; // Admin felület
                        } else {
                            document.getElementById('adminPanel').style.display = 'none'; // Nem admin felhasználó
                        }
        
                        // A Profilom link dinamikusan
                        const domain = "http://localhost:5001/";
                        const profileUrl = `${domain}/profil/${userId}`; // Dinamikusan generált profil URL
        
                        // Frissítjük a Profil linket
                        document.getElementById('profileItem').href = profileUrl;
                    } else {
                        // Nincs bejelentkezett felhasználó
                        document.getElementById('loginItem').style.display = 'block';
                        document.getElementById('logoutItem').style.display = 'none';
                        document.getElementById('profileItem').style.display = 'none';
                        document.getElementById('messagesItem').style.display = 'none';
                        document.getElementById('topicsItem').style.display = 'none';
                        document.getElementById('adminPanel').style.display = 'none';
                    }
                });
        
                // Kijelentkezés
                function logout() {
                    // Beállítjuk a localStorage-t, hogy a felhasználó ki legyen jelentkezve
                    localStorage.setItem('isLoggedIn', 'false');
                    localStorage.removeItem('role'); // Töröljük a szerepkört
                    localStorage.removeItem('userId'); // Töröljük a felhasználó ID-ját
                    // Frissítjük a menüt
                    document.getElementById('loginItem').style.display = 'block';
                    document.getElementById('logoutItem').style.display = 'none';
                    document.getElementById('profileItem').style.display = 'none';
                    document.getElementById('messagesItem').style.display = 'none';
                    document.getElementById('topicsItem').style.display = 'none';
                    document.getElementById('adminPanel').style.display = 'none';
        
                    alert('Sikeresen kijelentkeztél!');
                    window.location.href = '/fooldal.html';
                }
        
                // Keresési funkció
                function searchCourses() {
                    const query = document.getElementById('searchInput').value;
                    const searchResults = document.getElementById('searchResults');
                    searchResults.innerHTML = `<p>Keresési kifejezés: ${query}</p>`;
                }
            </script>
</body>
</html>
