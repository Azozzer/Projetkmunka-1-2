<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="profil.css">
    <title>SZE Tanulmányi Fórum - Profil</title>
</head>
<body>
    <header>
        <img src="sze.png" alt="SZE Tanulmányi Fórum" class="logo">
        <h1>SZE Tanulmányi Fórum</h1>
        <nav>
            <a href="#" class="menu-item" onclick="window.location.href='fooldal.html';">Főoldal</a>
            <a href="login.html" class="menu-item">Bejelentkezés</a>
        </nav>
    </header>

    <main>
        <div class="profile">
            <h2>Profilom</h2>
            <div class="profile-info">
                <img src="profiletest.png" alt="Profilkép" class="profile-pic">
                <div class="info-details">
                    <h3><strong>Felhasználónév</strong></h3>
                    <i>Hallgató</i>
                    <p><strong>Témák száma:</strong> 12</p>
                    <p><strong>Hozzászólások száma:</strong> 22</p>
                    <b>Reputáció</b>
                    <div class="likes-dislikes">
                        <div class="likes">
                            <img src="up.png" alt="Like" class="like-icon">
                            <span class="like-count">45</span>
                        </div>
                        <div class="dislikes">
                            <img src="down.png" alt="Dislike" class="dislike-icon">
                            <span class="dislike-count">3</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="user-topics">
                <h3>Témáim</h3>
                <ul>
                    <li><a href="#">Téma 1</a></li>
                    <li><a href="#">Téma 2</a></li>
                    <li><a href="#">Téma 3</a></li>
                    <li><a href="#">Téma 4</a></li>
                    <li><a href="#">Téma 5</a></li>
                </ul>
            </div>
            <a href="#" class="message-button" onclick="window.location.href='uzenet.html';">Üzenet írása</a>
            <a href="#" class="edit-button" onclick="window.location.href='profile_edit.html';">Profilom szerkesztése</a>
        </div>
    </main>

    <footer>
        <div class="contact-section">
            <h2>Kapcsolat</h2>
            <p>Email: asdasd@sze.hu</p>
        </div>
    </footer>
</body>
</html>
