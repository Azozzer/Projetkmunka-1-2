<!DOCTYPE html>

<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="targyakstyle.css">
    <title>SZE Tanulmányi Fórum</title>
</head>

<body> 
    <header>
        <div class="hamburger-menu">
            <input id="menu-toggle" type="checkbox" />
            <label class="menu-btn" for="menu-toggle">
                <span></span>
            </label>
            <ul class="menu-box">
                <li><a class="menu-item" href="#" onclick="window.location.href='fooldal.html';">Főoldal</a></li>
                <li><a class="menu-item" href="#" onclick="window.location.href='login.html';">Bejelentkezés</a></li>
                <li><a class="menu-item" href="#">Services</a></li>
                <li><a class="menu-item" href="#">Contact</a></li>
            </ul>
        </div>
        <h1 class="header-title">SZE Tanulmányi Fórum</h1>

        <nav>
            
        </nav>
    </header>

    <main>
        <div class="box">
        
        <!--Téma létrehozása-->
            <form action="tema_elonezet.html" method="POST">
                <h2 class="tema">Új téma létrehozása</h2>
                <!--Téma neve-->
                <section class="tema-elnevezes">
                    <label for="tema-nev">Téma neve:  
                        <input id="tema-nev" name="tema-nev" type="text" maxlength="100" required placeholder="Adja meg a téma nevét *">
                    </label>
                </section>


                <!--Leírás mező-->
                <section class="leiras-text">
                    <label for="leiras">Leírás (opcionális): 
                        <textarea id="leiras" name="leiras" maxlength="1500" placeholder="Ide írhatja a feltöltendő téma leírását..."></textarea>
                    </label>
                </section>

                <!--Fájl feltöltése-->
                <section class="file-feltoltes">
                    <input type="file" class="file-upload" required/>
                </section>

                <!--Küldés gomb-->
                <section class="kuldesgomb">
                    <button type="submit">Küldés</button>
                </section>
            </form>
        </div>
    </main>



    <footer>
        <div class="contact-section">
            <h2>Kapcsolat</h2>
            <p>Email: asdasd@sze.hu</p>
    </footer>
</body>


</html>
