<!DOCTYPE html>

<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="targyakstyle.css">
    <title>SZE Tanulmányi Fórum</title>
</head>

<body> 
    <header>
        <img src="sze.png" alt="SZE Tanulmányi Fórum" class="logo">
        <h1>SZE Tanulmányi Fórum</h1>
    </header>

    <main>
        
        <h2 class="tema">Új téma létrehozása</h2>
        <!--Téma létrehozása-->
        <form>
            <!--Téma neve-->
            <section class="tema-elnevezes">
                <label for="tema-nev">Téma neve: 
                    <input id="tema-nev" name="tema-nev" type="text" maxlength="100" required>
                </label>
            </section>


            <!--Leírás mező-->
            <section class="leiras-text">
                <label for="leiras">Leírás (opcionális): 
                    <textarea id="leiras" name="leiras" maxlength="1500"></textarea>
                </label>
            </section>

            <!--Fájl feltöltése-->
            <section class="file-feltoltes">
                <input type="file" accept="image/*" class="file-upload" required/>
            </section>

            <!--Küldés gomb-->
            <section class="kuldesgomb">
                <button type="submit">Küldés</button>
            </section>
        </form>



    </main>



    <footer>
        <div class="contact-section">
            <h2>Kapcsolat</h2>
            <p>Email: asdasd@sze.hu</p>
    </footer>
</body>


</html>
