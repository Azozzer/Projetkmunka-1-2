<!DOCTYPE html>
<html lang="hu">
<head>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>SZE Tanulmányi Fórum - Bejelentkezés</title>
</head>
<body>
    <header>
        <div class="hamburger-menu">
            <input id="menu-toggle" type="checkbox" />
            <label class="menu-btn" for="menu-toggle">
                <span></span>
            </label>
            <ul class="menu-box">
                <li><a class="menu-item" href="#" onclick="window.location.href='fooldal.html';">Főoldal</a></li>
                <li><a class="menu-item" href="#" onclick="window.location.href='login.html';">Bejelentkezés</a></li>
            </ul>
        </div>
        <h1 class="header-title">SZE Tanulmányi Fórum</h1>
    </header>
    <main>
        <div class="login-form">
            <h2>Bejelentkezés</h2>
            <form onsubmit="return login(event)">
                <div class="form-group">
                    <label for="username"><b>Felhasználónév</b></label>
                    <input type="text" id="username" name="username" required placeholder="Adja meg a felhasználónevét*">
                </div>
                <div class="form-group">
                    <label for="password"><b>Jelszó</b></label>
                    <input type="password" id="password" name="password" required placeholder="Adja meg a jelszavát*">
                </div>
                <div class="form-group">
                    <button type="submit" class="login-button">Bejelentkezés</button>
                </div>
                <div class="form-group">
                    <label for="remember-password">
                        <input type="checkbox" id="remember-password" name="remember-password">
                        Megjegyezze a jelszót?
                    </label>
                </div>
            </form>
            <div class="register-link">
                <p>Még nincs fiókod? <a href="reg.html">Regisztrálj itt</a></p>
            </div>
            <div class="register-link">
                <p>Elfelejtetted a jelszavad? <a href="reminder.html">Kattints ide</a></p>
            </div>
        </div> 
    </main>
    <footer>
        <div class="contact-section">
            <h2>Kapcsolat</h2>
            <p>Email: asdasd@sze.hu</p>
        </div>
    </footer>

    <script>
        function login(event) {
            event.preventDefault(); // Megakadályozza, hogy a form elküldje az adatokat
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // A bejelentkezés ellenőrzése (tesztadatokkal)
            if (username === "user" && password === "password") {
                // Sikeres bejelentkezés
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('role', 'user'); // Beállítjuk a szerepkört
                window.location.href = 'fooldal.html'; // Visszairányítjuk a főoldalra
            } else if (username === "admin" && password === "admin") {
                // Admin bejelentkezés
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('role', 'admin');
                window.location.href = 'fooldal.html'; // Visszairányítjuk a főoldalra
            } else {
                alert('Hibás felhasználónév vagy jelszó');
                return false;
            }
        }
    </script>
</body>
</html>
