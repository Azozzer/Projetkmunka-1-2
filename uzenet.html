<!DOCTYPE html>
<html lang="hu">
<head>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="uzenet.css">
    <title>SZE Tanulmányi Fórum - Üzenőfal</title>
</head>
<body>
    <header>
        <div class="hamburger-menu">
            <input id="menu-toggle" type="checkbox" />
            <label class="menu-btn" for="menu-toggle">
                <span></span>
            </label>
            <ul class="menu-box">
                <li><a class="menu-item" href="#" onclick="window.location.href='fooldal.html';">Főoldal</a></li>
                <li><a class="menu-item" href="#" onclick="window.location.href='profil.html';">Profilom</a></li>
                <li><a class="menu-item" href="#">Services</a></li>
                <li><a class="menu-item" href="#">Contact</a></li>
            </ul>
        </div>
        <h1 class="header-title">SZE Tanulmányi Fórum</h1>
        <nav>
            <a href="#" class="login-item">Bejelentkezés</a>
        </nav>
    </header>

    <main>
        <div class="message-board">
            <h2>Üzenőfal</h2>
            
            <div class="messages">
                <!-- Korábbi üzenetek -->
                <div class="message">
                    <img src="profilepic.jpg" alt="Profil" class="profile-pic">
                    <div class="message-content">
                        <p><strong>Admin</strong></p>
                        <p>Szia! Semmi extra.</p>
                        <img src="cutecat.jpg" alt="Kép" class="message-image">
                        <a href="#" class="message-link"></a>
                    </div>
                </div>
                <div class="message">
                    <img src="profilepic2.jpg" alt="Profil" class="profile-pic">
                    <div class="message-content">
                        <p><strong>Moderátor</strong></p>
                        <p>Szia! Mi újság?</p>
                        <a href="#" class="message-link">Link</a>
                    </div>
                </div>
            </div>

            <form class="message-form">
                <textarea placeholder="Írj egy üzenetet..." required></textarea>
                <input type="file" accept="image/*" class="file-upload" />
                <button type="submit">Küldés</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="contact-section">
            <h2>Kapcsolat</h2>
            <p>Email: asdasd@sze.hu</p>
        </div>
    </footer>
</body>
</html>
